<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Dashboard</title>
<style>
  :root {
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --text: #1F2933;
    --muted: #6B7280;
    --border: #E1E5EA;
    --primary: #2563EB;
    --c1: #2563EB; --c2: #F59E0B; --c3: #10B981; --c4: #EF4444;
    --radius: 4px;
    --font: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --surface: #1B2027; --text: #E8EAED; --muted: #9AA3AF; --border: #2E353F; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: var(--font); line-height: 1.5;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 16px; font-size: 1.75rem; font-weight: 800; letter-spacing: -.01em; }
  .kpis, .charts { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(3, 1fr); margin-bottom: 16px; }
  .charts { grid-template-columns: repeat(2, 1fr); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .kpi { border-left: 4px solid var(--c1); }
  .kpi:nth-child(2) { border-left-color: var(--c2); }
  .kpi:nth-child(3) { border-left-color: var(--c3); }
  .kpi .label { color: var(--muted); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .kpi .value { font-size: 2.25rem; font-weight: 800; line-height: 1.15; margin-top: 4px; }
  .card h2 { margin: 0 0 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .wide { grid-column: 1 / -1; }
  .box { position: relative; height: 300px; }
  @media (max-width: 700px) {
    .kpis, .charts { grid-template-columns: 1fr; }
    .wide { grid-column: auto; }
  }
</style>
</head>
<body>
<main>
  <h1>Sales Dashboard</h1>

  <section class="kpis">
    <div class="card kpi"><div class="label">Total revenue</div><div class="value" id="kRev"></div></div>
    <div class="card kpi"><div class="label">Total units</div><div class="value" id="kUnits"></div></div>
    <div class="card kpi"><div class="label">Orders</div><div class="value" id="kOrders"></div></div>
  </section>

  <section class="charts">
    <div class="card wide"><h2>Revenue by month and region</h2><div class="box"><canvas id="cLine"></canvas></div></div>
    <div class="card"><h2>Units by product</h2><div class="box"><canvas id="cBar"></canvas></div></div>
    <div class="card"><h2>Revenue share by region</h2><div class="box"><canvas id="cPie"></canvas></div></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const data = [
  { month: "2026-01", region: "North", product: "Widget", units: 120, revenue: 24000 },
  { month: "2026-01", region: "South", product: "Gadget", units: 80,  revenue: 20000 },
  { month: "2026-02", region: "North", product: "Widget", units: 150, revenue: 30000 },
  { month: "2026-02", region: "South", product: "Gadget", units: 95,  revenue: 23750 },
  { month: "2026-03", region: "North", product: "Gadget", units: 110, revenue: 27500 },
  { month: "2026-03", region: "South", product: "Widget", units: 130, revenue: 26000 },
  { month: "2026-04", region: "North", product: "Widget", units: 170, revenue: 34000 },
  { month: "2026-04", region: "South", product: "Gadget", units: 105, revenue: 26250 },
  { month: "2026-05", region: "North", product: "Gadget", units: 125, revenue: 31250 },
  { month: "2026-05", region: "South", product: "Widget", units: 140, revenue: 28000 },
  { month: "2026-06", region: "North", product: "Widget", units: 180, revenue: 36000 },
  { month: "2026-06", region: "South", product: "Gadget", units: 115, revenue: 28750 },
];

const sum = (rows, k) => rows.reduce((a, r) => a + r[k], 0);
const uniq = k => [...new Set(data.map(r => r[k]))];
const by = (k, v) => data.filter(r => r[k] === v);

const css = getComputedStyle(document.documentElement);
const v = n => css.getPropertyValue(n).trim();
const [c1, c2, c3] = [v("--c1"), v("--c2"), v("--c3")];

const months = uniq("month");
const regions = uniq("region");
const products = uniq("product");
const regionColor = { North: c1, South: c2 };
const fmt = n => n.toLocaleString("en-US");

document.getElementById("kRev").textContent = "$" + fmt(sum(data, "revenue"));
document.getElementById("kUnits").textContent = fmt(sum(data, "units"));
document.getElementById("kOrders").textContent = fmt(data.length);

Chart.defaults.color = v("--muted");
Chart.defaults.borderColor = v("--border");
Chart.defaults.font.family = v("--font");
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.plugins.legend.labels.boxWidth = 12;
Chart.defaults.plugins.legend.labels.boxHeight = 12;
Chart.defaults.plugins.tooltip.backgroundColor = v("--text");
Chart.defaults.plugins.tooltip.titleColor = v("--surface");
Chart.defaults.plugins.tooltip.bodyColor = v("--surface");
Chart.defaults.plugins.tooltip.cornerRadius = 4;

// thin horizontal gridlines only, no axis lines
const scales = extra => ({
  x: { grid: { display: false }, border: { color: v("--border") } },
  y: { beginAtZero: true, grid: { color: v("--border"), lineWidth: 1 }, border: { display: false }, ...extra },
});

new Chart("cLine", {
  type: "line",
  data: {
    labels: months,
    datasets: regions.map(r => ({
      label: r,
      data: months.map(m => sum(data.filter(d => d.region === r && d.month === m), "revenue")),
      borderColor: regionColor[r], backgroundColor: regionColor[r], borderWidth: 2,
      tension: 0, fill: false, pointRadius: 3, pointHoverRadius: 5,
    })),
  },
  options: { scales: scales({ ticks: { callback: v => "$" + fmt(v) } }) },
});

new Chart("cBar", {
  type: "bar",
  data: {
    labels: products,
    datasets: [{ label: "Units", data: products.map(p => sum(by("product", p), "units")), backgroundColor: c3, borderWidth: 0, borderRadius: 0 }],
  },
  options: { plugins: { legend: { display: false } }, scales: scales() },
});

new Chart("cPie", {
  type: "doughnut",
  data: {
    labels: regions,
    datasets: [{ data: regions.map(r => sum(by("region", r), "revenue")), backgroundColor: regions.map(r => regionColor[r]), borderColor: v("--surface"), borderWidth: 3 }],
  },
  options: { plugins: { tooltip: { callbacks: { label: c => `${c.label}: $${fmt(c.parsed)}` } } } },
});
</script>
</body>
</html>
